quarkus.log.level=INFO
#quarkus.log.min-level=TRACE

quarkus.swagger-ui.always-include=true

quarkus.log.category."io.quarkiverse.flow.opentelemetry".level=DEBUG

quarkus.flow.tracing.enabled=false

# Quarkus Flow Runner Configuration
quarkus.flow.runner.enabled=true
quarkus.flow.runner.source.path=src/main/resources/flow

# Security - API Key mode for demo
quarkus.flow.runner.security.type=api-key
quarkus.flow.runner.security.api-keys.demo.secret=${FLOW_API_KEY:demo-secret-change-me}
quarkus.flow.runner.security.api-keys.demo.roles=flow-admin

# OpenTelemetry

# JPA Persistence configuration
%jpa-persistence.quarkus.hibernate-orm.schema-management.strategy=update
%jpa-persistence.quarkus.datasource.db-kind=postgresql
%jpa-persistence.quarkus.datasource.username=postgres
%jpa-persistence.quarkus.datasource.password=pass
%jpa-persistence.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/qflow

%mvstore-persistence.quarkus.flow.persistence.mvstore.db-path=testFlowMVStore.db