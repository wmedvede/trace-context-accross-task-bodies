quarkus.log.level=INFO
quarkus.log.category."org.acme".level=DEBUG

quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId}, parentId=%X{parentId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{2.}] (%t) %s%e%n 

quarkus.http.port=8585

quarkus.swagger-ui.always-include=true

# Quarkus OpenTelemetry configuration (works with both addons)
# Defaults to ${quarkus.application.name:unset}, we shouldn't need to add this property
# quarkus.otel.service.name=test-sonataflow-opentelemetry
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
# Default value is grpc, we shouldn't need to add this property.
# quarkus.otel.exporter.otlp.protocol=grpc


quarkus.smallrye-openapi.servers-from-hosts=true